[project]
name = "rag-exp"
version = "0.0.1"
description = "A from-scratch RAG learning lab: ingest → chunk → embed → vector store → retrieve, with a server-side entitlement filter as the security boundary."
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "sentence-transformers>=5.5.1",
    "tiktoken>=0.13.0",
    "langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

# Intel-Mac (x86_64-macOS) compatibility caps — see docs/decisions/ADR-003.
# The modern ML stack dropped x86_64-macOS wheels; these pin the last versions
# that still ship one, plus two runtime pins torch 2.2.2 requires. Transitive
# only — direct deps (chromadb, sentence-transformers 5.5.1) are unchanged.
[tool.uv]
constraint-dependencies = [
    "onnxruntime<=1.23.2",   # last cp312 x86_64-macOS wheel; chromadb needs >=1.14.1
    "torch<=2.2.2",          # last cp312 x86_64-macOS wheel; ST needs >=1.11.0
    "numpy<2",               # torch 2.2.2 built against numpy 1.x ("Numpy is not available")
    "transformers<5",        # transformers 5.x requires torch>=2.4 at runtime
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_exp"]
